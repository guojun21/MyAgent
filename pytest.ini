[pytest]
# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    slow: 标记为慢速测试（需要 LLM 调用）
    integration: 集成测试（需要服务运行）

# 异步测试
asyncio_mode = auto

# 输出配置
addopts = -v --tb=short

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
